name: ntfy

services:
  ntfy:
    container_name: ntfy
    # Tag comes from the environment so a bad :latest can be pinned out without
    # editing this file. The units set NTFY_TAG=latest and let
    # /tank/ntfy/image.env override it; the default here covers by-hand runs.
    image: docker.io/binwiederhier/ntfy:${NTFY_TAG:-latest}
    # Deliberately NO restart policy: systemd is the only supervisor.
    # With one here, dockerd restarts the container behind ntfy.service's back --
    # the attached `compose up` never exits, so a crash-loop leaves the unit
    # green, Restart=always dead code, and the outage invisible. Without one, a
    # container exit ends `compose up`, and systemd restarts it in the journal
    # where you can see it.
    user: "${DOCKER_UID}:${DOCKER_GID}"
    cpus: '0.50'
    mem_limit: 500M
    mem_reservation: 15M
    ports:
      - 8123:80
    volumes:
      - config:/etc/ntfy
      - cache:/var/cache/ntfy
      - auth:/var/lib/ntfy
    environment:
      - TZ=America/New_York
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    command:
      - serve
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://0.0.0.0 || exit 1"]
      interval: 1m30s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3
volumes:
  cache:
    driver: local
    driver_opts:
      device: /tank/ntfy/cache
      o: bind
      type: none
  config:
    driver: local
    driver_opts:
      device: /tank/ntfy/config
      o: bind
      type: none
  auth:
    driver: local
    driver_opts:
      device: /tank/ntfy/auth
      o: bind
      type: none
